# Збирає Android-застосунок «Часик» (APK).
# Кожна збірка — артефакт у вкладці Actions; при оновленні main — ще й реліз із файлом chasyk.apk.
name: Android APK

on:
  push:
    branches: [main, android-app]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Встановити залежності
        run: npm ci

      - name: Скопіювати сайт у застосунок
        run: npm run sync

      - name: Зібрати APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../chasyk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chasyk-apk
          path: chasyk.apk

      - name: Реліз
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Часик для Android 1.0.${{ github.run_number }}
          make_latest: true
          files: chasyk.apk
          body: |
            Завантажте **chasyk.apk** на телефон і відкрийте файл, щоб встановити.
            Нова версія ставиться поверх старої — розпорядки й зірки зберігаються.

  # ВРЕМЕННО: проверка в эмуляторе (будет удалено перед слиянием)
  smoke:
    needs: build
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: chasyk-apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p out
            adb install -r chasyk.apk && echo "::notice::install ok"
            adb shell am start -n io.github.natalikazichuk.chasyk/.MainActivity
            sleep 12
            adb exec-out screencap -p > out/1-start.png
            adb shell input tap 160 430 ; sleep 4
            adb exec-out screencap -p > out/2-tap.png
            adb shell dumpsys window | grep -iE "KEEP_SCREEN_ON|mCurrentFocus" | head -5 > out/window.txt || true
            adb shell input keyevent 4 ; sleep 2 ; adb exec-out screencap -p > out/3-back-on-routine.png
            adb shell input keyevent 4 ; sleep 3
            adb shell dumpsys activity activities | grep -E "topResumedActivity|mResumedActivity" > out/after-back.txt || true
            adb logcat -d | grep -iE "Capacitor|chromium|AndroidRuntime" | tail -150 > out/logcat.txt || true
            echo "::notice::window $(tr '\n' ' ' < out/window.txt)"
            echo "::notice::after-back $(tr '\n' ' ' < out/after-back.txt)"
      - name: Push results
        run: |
          mkdir pub && cp chasyk.apk out/* pub/ && cd pub
          git init -q -b apk-preview && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "APK preview ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-preview
