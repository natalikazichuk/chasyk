# Збирає Android-застосунок «CHASIK» (APK).
# Кожна збірка — артефакт у вкладці Actions; при оновленні main — ще й реліз із файлом chasyk.apk.
name: Android APK

on:
  push:
    branches: [main, android-app]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Встановити залежності
        run: npm ci

      - name: Скопіювати сайт у застосунок
        run: npm run sync

      - name: Зібрати APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../chasyk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chasyk-apk
          path: chasyk.apk

      - name: Реліз
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: CHASIK для Android 1.0.${{ github.run_number }}
          make_latest: true
          files: chasyk.apk
          body: |
            Завантажте **chasyk.apk** на телефон і відкрийте файл, щоб встановити.
            Нова версія ставиться поверх старої — розпорядки й зірки зберігаються.

