<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHASIK</title>
<meta name="description" content="Простий трекер часу для дитини: справа, круг, що тане, і кнопка «Готово».">
<meta name="theme-color" content="#5b8def">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#fdf8f0;--card:#ffffff;--ink:#2d2a32;--muted:#857f8f;--line:#ece4d8;--track:#efe7da;
  --accent:#5b8def;--green:#34b26a;--green-d:#25844d;--yellow:#f2b200;--red:#e8554e;--danger:#d64541;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1c1a22;--card:#27242f;--ink:#f2eef7;--muted:#9c95a8;--line:#3a3542;--track:#332f3b;--green-d:#1d6b3f;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1c1a22;--card:#27242f;--ink:#f2eef7;--muted:#9c95a8;--line:#3a3542;--track:#332f3b;--green-d:#1d6b3f;color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.muted{color:var(--muted)}

/* ---------- верхня панель ---------- */
.top{display:flex;align-items:center;gap:10px;min-height:56px}
.who{font-weight:800;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stars{font-weight:800;font-size:20px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px;white-space:nowrap}
.gear{position:relative;width:48px;height:48px;flex:none;border:0;border-radius:50%;background:transparent;font-size:22px;opacity:.45;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gear svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.gear circle{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-dasharray:139;stroke-dashoffset:139}
.gear.hold{opacity:1}
.gear.hold circle{stroke-dashoffset:0;transition:stroke-dashoffset 3s linear}

/* ---------- екран дитини ---------- */
.child{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:8px 0}
.now-label{text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:800;color:var(--muted)}
.task-icon{font-size:clamp(64px,19vw,100px);line-height:1.1}
.task-name{font-size:clamp(26px,7.5vw,38px);font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.timer{position:relative;width:min(58vw,260px);aspect-ratio:1;margin:6px auto 0}
.timer svg{width:100%;height:100%;display:block}
.t-bg{fill:var(--track);transition:fill .4s}
.t-pie{fill:none;stroke-width:48;transition:stroke .6s}
.timer.over .t-bg{fill:var(--red);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.t-text b{display:block;font-size:clamp(28px,8vw,40px);font-weight:900;line-height:1.1}
.t-text span{font-size:16px;color:var(--muted);font-weight:700}
.timer.over + .t-text b{color:var(--red)}
.btn-main{width:100%;max-width:420px;min-height:88px;margin-top:10px;border:0;border-radius:28px;background:var(--green);color:#fff;font-size:34px;font-weight:900;letter-spacing:.02em;box-shadow:0 7px 0 var(--green-d);transition:transform .08s,box-shadow .08s;user-select:none;-webkit-user-select:none}
.btn-main:active{transform:translateY(5px);box-shadow:0 2px 0 var(--green-d)}
.btn-main:focus-visible{outline:4px solid var(--accent);outline-offset:4px}
.next{font-size:18px;color:var(--muted);margin-top:8px}
.clock{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctrl{display:flex;gap:10px;width:100%;max-width:420px;margin-top:14px}
.ctrl button{flex:1;min-height:52px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:800}
.ctrl button:active{transform:translateY(2px)}
.ctrl button{font-size:16px;padding:0 6px;white-space:nowrap}
.r-chip.ok{cursor:pointer}
.btn-main.resume{background:var(--accent);box-shadow:0 7px 0 #3f6fc9}
.timer.paused{opacity:.45}
.paused-label{font-size:20px;font-weight:900;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.countdown{display:inline-block;margin-top:6px;padding:6px 16px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-size:22px;font-weight:900}
.next span{color:var(--ink);font-weight:800}
.dots{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--green)}
.dots i.cur{background:var(--accent);transform:scale(1.35)}
.big-emoji{font-size:clamp(72px,22vw,110px);line-height:1.1}
.child h1{font-size:clamp(28px,8vw,40px);font-weight:900}
.child p{font-size:18px}
.today{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin-top:14px}
.r-chip{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:20px;border:2px solid var(--line);background:var(--card);text-align:left;min-height:64px}
.r-chip span{font-size:30px}
.r-chip b{flex:1;font-size:18px}
.r-chip small{font-size:15px;color:var(--muted);font-weight:700}
.r-chip.ok{opacity:.6}
.r-chip.ok small{color:var(--green)}
.hint{font-size:14px;color:var(--muted);margin-top:4px}
.stars-row{font-size:34px;letter-spacing:4px;max-width:340px;line-height:1.3}

.reward{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:800}
.reward .rw{flex:1;min-width:0}
.reward .rw div{overflow-wrap:anywhere;line-height:1.25}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:5px;transition:width .5s}
.reward.got{border-color:var(--yellow)}

.fly{position:fixed;left:50%;top:50%;font-size:64px;pointer-events:none;z-index:50;animation:fly 0.9s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}25%{transform:translate(-50%,-60%) scale(1.3);opacity:1}100%{transform:translate(-50%,-260%) scale(.8);opacity:0}}

/* ---------- вікна і підказки ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(20,16,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:380px;max-height:86vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:22px}
.modal .q{font-size:26px;font-weight:900}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.emoji-grid button{font-size:28px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;z-index:60;max-width:calc(100% - 32px);text-align:center;animation:fade 2.4s forwards}
@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}

/* ---------- режим дорослого ---------- */
.parent{display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
.parent h3{font-size:17px;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 10px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.r-head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.r-head b{font-size:17px}
.r-head .muted{font-size:14px;margin-top:2px}
.r-icons{font-size:24px;letter-spacing:3px;overflow-wrap:anywhere}
.btn,.btn-sm{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-weight:700;min-height:44px}
.btn-sm{padding:7px 12px;min-height:38px;font-size:14px;flex:none}
.btn.primary,.btn-sm.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row .grow{flex:1}
.edit-actions{flex-wrap:nowrap;margin-top:8px}
.edit-actions .btn{padding:11px 12px;white-space:nowrap;min-width:0}
.edit-actions .danger{margin-right:auto}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
input[type=text],input[type=time],input[inputmode],select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:17px;color:var(--ink);width:100%;min-height:46px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:14px;padding:0}
.day.on{background:var(--accent);border-color:var(--accent);color:#fff}
.t-row{display:grid;grid-template-columns:50px 1fr;gap:8px 10px;align-items:center;padding:10px}
.ico{height:50px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:28px}
.t-row input{min-height:42px;padding:8px 10px;font-size:16px}
.t-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.t-row .t-bottom{grid-column:1/-1;flex-wrap:nowrap}
.step{display:flex;align-items:center;gap:6px}
.step button,.t-tools button{width:40px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:18px}
.step b{min-width:30px;text-align:center;font-size:17px}
.step small{color:var(--muted);margin-right:2px}
.t-tools{display:flex;gap:6px}
.t-tools button:disabled{opacity:.3;cursor:default}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:700;color:var(--ink);flex-direction:row}
.switch input{width:24px;height:24px;accent-color:var(--accent)}
.stat-row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;font-size:15px}
.stat-row .bar{margin:0;height:12px}
.stat-row .bar i{background:var(--green)}
.tip{font-size:15px;line-height:1.45}
.tip b{font-weight:800}
.small{font-size:14px;line-height:1.5}
.tz-now{font-size:15px;color:var(--ink);font-weight:700}
</style>
</head>

      <p>${T('allDone', { name: esc(f.name) })}</p>
      <div class="stars-row">${'⭐'.repeat(Math.min(f.stars, 12))}</div>
      <button class="btn-main" onclick="A.closeFinish()">${esc(T('hooray'))}</button>
      ${canUndo() ? `<div class="ctrl"><button onclick="A.undo()">${esc(T('back'))}</button></div>` : ''}`;
  } else if (r) {
    const t = r.tasks[run.idx], nx = r.tasks[run.idx + 1];
    body = `<div class="now-label">${esc(T('now'))}</div>
      <div class="task-icon">${t.icon}</div>
      <h1 class="task-name">${esc(tname(t))}</h1>
      <div class="timer" id="timer"><svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="t-bg" cx="50" cy="50" r="48"/>
        <circle class="t-pie" id="pie" cx="50" cy="50" r="24" transform="rotate(-90 50 50)" stroke-dasharray="0 151"/>
      </svg></div>
      <div class="t-text" aria-live="polite"><b id="tBig"></b><span id="tSmall"></span></div>
      ${run.paused
        ? `<div class="paused-label">${esc(T('paused'))}</div><button class="btn-main resume" onclick="A.resume()">${esc(T('resume'))}</button>`
        : `<button class="btn-main" onclick="A.done()">${esc(T('done'))}</button>`}
      <div class="ctrl">${canUndo() ? `<button onclick="A.undo()">${esc(T('back'))}</button>` : ''}${run.paused ? '' : `<button onclick="A.pause()">${esc(T('pause'))}</button>`}<button onclick="A.stopChild()">${esc(T('stopShort'))}</button></div>
      <div class="next">${nx ? `${esc(T('next'))}: <span>${nx.icon} ${esc(tname(nx))}</span>` : esc(T('last'))}</div>
      <div class="dots">${r.tasks.map((x, i) => `<i class="${i < run.idx ? 'on' : i === run.idx ? 'cur' : ''}"></i>`).join('')}</div>`;
  } else {
    const dow = dowNow(), m = minsNow();
    const list = state.routines.filter(x => x.days.includes(dow) && x.tasks.length).sort((a, b) => hm(a.start) - hm(b.start));
    const nextR = list.find(x => hm(x.start) > m && !h.done[x.id]);
    body = `<div class="big-emoji">🎈</div><h1>${esc(T('free'))}</h1>
      <p class="muted">${nextR ? T('atTime', { t: nextR.start, name: esc(rname(nextR)) }) : esc(T('relax'))}</p>
      ${nextR ? `<div class="countdown" aria-live="polite">⏳ ${esc(inTime(hm(nextR.start) - m))}</div>` : ''}
      ${list.length ? `<div class="today">${list.map(x => `
        <button class="r-chip ${h.done[x.id] ? 'ok' : ''}" onclick="A.${h.done[x.id] ? 'again' : 'start'}('${x.id}')">
          <span>${x.tasks[0].icon}</span><b>${esc(rname(x))}</b><small>${h.done[x.id] ? esc(T('doneMark')) : x.start}</small>
        </button>`).join('')}</div>
        <div class="hint">${esc(T('startEarly'))}</div>`
      : `<p class="hint">${esc(T('noRoutinesChild'))}</p>`}`;
  }
  app.innerHTML = `<header class="top"><div class="who">${r ? esc(rname(r)) : esc(T('appName'))}</div>
    <div class="clock" id="clock" title="${esc(T('clockTitle'))}">${clockNow()}</div>
    <div class="stars" title="${esc(T('starsToday'))}">⭐ ${h.stars}</div>${gearHTML()}</header>
    <main class="child">${body}</main>${rewardHTML()}`;
  bindGear();
  updateTimer();
}

function updateTimer() {
  const run = state.run, r = run && routine(run.rid), pie = $('#pie');
  if (!r || !pie || view !== 'child' || state.finished) return;
  const t = r.tasks[run.idx], plan = t.min * 60000, el = (run.paused || Date.now()) - run.t0;
  const left = plan - el, f = Math.max(0, left / plan);
  pie.setAttribute('stroke-dasharray', `${(f * 150.8).toFixed(2)} 151`);
  pie.style.stroke = f > 0.25 ? 'var(--green)' : left > 0 ? 'var(--yellow)' : 'var(--red)'; // червоний — лише коли час вийшов
  $('#timer').classList.toggle('over', left <= 0);
  $('#timer').classList.toggle('paused', !!run.paused);
  const big = $('#tBig'), small = $('#tSmall');
  if (left > 0) {
    const s = Math.ceil(left / 1000);
    big.textContent = s >= 60 ? `${Math.ceil(s / 60)} ${T('min')}` : `${s} ${T('sec')}`;
    small.textContent = T('left');
  } else {
    const over = Math.floor(-left / 60000);
    big.textContent = T('timeUp');
    small.textContent = over > 0 ? `+${over} ${T('min')} · ${T('finishUp')}` : T('finishUp');
    if (!run.alerted) { run.alerted = true; save(); chime(); }
  }
}

function bindGear() {
  const g = $('#gear'); if (!g) return;
  let t = null, t0 = 0;
  const cancel = () => { clearTimeout(t); t = null; g.classList.remove('hold'); };
  g.addEventListener('pointerdown', e => {
    e.preventDefault(); t0 = Date.now(); g.classList.add('hold');
    t = setTimeout(() => { cancel(); A.gate(); }, 3000);
  });
  g.addEventListener('pointerup', () => { if (t && Date.now() - t0 < 2500) toast(T('gearToast')); cancel(); });
  g.addEventListener('pointerleave', cancel);
  g.addEventListener('pointercancel', cancel);
  g.addEventListener('contextmenu', e => e.preventDefault());
  g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); A.gate(); } });
}

/* ---------- вікна ---------- */
function modal(html) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  document.body.appendChild(bg);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
let gateAns = 0;
function confirmBox(text, okLabel, fn) {
  modal(`<h2>${text}</h2><div class="row end"><button class="btn" onclick="A.closeModal()">${esc(T('cancel'))}</button>
    <button class="btn primary" id="okBtn">${esc(okLabel)}</button></div>`);
  $('#okBtn').onclick = () => { closeModal(); fn(); };
}

/* ---------- режим дорослого ---------- */
function daysLabel(d) {
  const s = [...d].sort().join();
  if (s === '0,1,2,3,4,5,6') return T('everyDay');
  if (s === '1,2,3,4,5') return T('weekdays');
  if (s === '0,6') return T('weekend');
  if (!d.length) return T('noDays');
  return DOW_ORDER.filter(n => d.includes(n)).map(n => T('dow')[n]).join(', ');
}

function renderParent() {
  view = 'parent';

  if (draft) content = editorHTML();
  else if (pTab === 'routines') content = routinesHTML();
  else if (pTab === 'stats') content = statsHTML();
  else if (pTab === 'reward') content = rewardTabHTML();
  else content = settingsHTML();
  const tabs = [['routines','tabRoutines'],['stats','tabStats'],['reward','tabReward'],['settings','tabSettings']];
  app.innerHTML = `<header class="top"><div class="who">${esc(T('parentMode'))}</div>
      <button class="btn-sm primary" onclick="A.exitParent()">${esc(T('toChild'))}</button></header>

function statsHTML() {
  const rows = [];
  let maxStars = 1;
  for (let i = 6; i >= 0; i--) {
    const ms = Date.now() - i * 864e5, z = zp(ms), h = state.history[dayKey(ms)];
    const st = h ? h.stars : 0, late = h ? h.tasks.filter(t => t.late).length : 0;
    maxStars = Math.max(maxStars, st);
    rows.push({ label: i === 0 ? T('today') : `${T('dow')[z.dow]} ${z.d}`, st, late });
  }
  const agg = {};
  for (const h of Object.values(state.history)) for (const t of h.tasks) {
    const tk = t.tk || keyOf('k.', t.name);
    const k = t.icon + ' ' + (tk ? T('k.' + tk) : t.name);
    const a = agg[k] || (agg[k] = { n: 0, late: 0, sum: 0, plan: t.plan });
    a.n++; a.late += t.late ? 1 : 0; a.sum += t.actual; a.plan = t.plan;
  }
  const hard = Object.entries(agg).filter(([, a]) => a.n >= 2 && a.late / a.n >= 0.5)
    .sort((x, y) => y[1].late / y[1].n - x[1].late / x[1].n).slice(0, 5);
  const any = Object.keys(agg).length;
  return `<div class="card"><b>${esc(T('weekStars'))}</b>
    ${rows.map(r => `<div class="stat-row"><span>${esc(r.label)}</span><div class="bar"><i style="width:${r.st / maxStars * 100}%"></i></div>
      <span>⭐ ${r.st}${r.late ? ` <span class="muted">· ⏰${r.late}</span>` : ''}</span></div>`).join('')}
    <p class="small muted">${esc(T('lateNote'))}</p></div>
    <div class="card"><b>${esc(T('hardTitle'))}</b>
    ${!any ? `<p class="tip muted">${esc(T('noData'))}</p>`
      : hard.length ? hard.map(([k, a]) => `<p class="tip"><b>${esc(k)}</b> ${esc(T('hardLine', { late: a.late, n: a.n, avg: Math.round(a.sum / a.n), plan: a.plan, sug: Math.ceil(a.sum / a.n) }))}</p>`).join('')
      : `<p class="tip">${esc(T('allGood'))}</p>`}</div>`;
}

/* ---------- дії ---------- */
const A = {
  done() {
    const run = validRun(); if (!run) return renderChild();
    if (Date.now() - lastDone < 900) return; // захист від подвійного натискання
    lastDone = Date.now(); unlockAudio();
    const r = routine(run.rid), t = r.tasks[run.idx], h = hist(run.date);
    const actual = (Date.now() - run.t0) / 60000;
    (state.undo || (state.undo = [])).push({ rid: run.rid, date: run.date, s0: run.s0, idx: run.idx, t0: run.t0, reward: !!state.reward.on, last: run.idx + 1 >= r.tasks.length });
    h.tasks.push({ icon: t.icon, tk: t.tk, name: tname(t), plan: t.min, actual: Math.round(actual * 10) / 10, late: actual > t.min });
    h.stars++;
    if (state.reward.on) state.reward.stars++;
    run.idx++;
    if (run.idx >= r.tasks.length) {
      h.done[r.id] = true;
      state.finished = { name: rname(r), stars: r.tasks.length, date: dayKey() };
      state.run = null;
    } else { run.t0 = Date.now(); run.alerted = false; }
    save(); flyStar();
    try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
    renderChild();
  },
  // ↩️ Назад: скасувати останнє «Готово» (зірку, запис у підсумках) і повернутися до тієї справи
  undo() {
    const u = canUndo() && state.undo.pop(); if (!u) return renderChild();
    const h = hist(u.date), i = h.tasks.length - 1;
    if (i >= 0) h.tasks.splice(i, 1);
    h.stars = Math.max(0, h.stars - 1);
    if (u.reward && state.reward.stars > 0) state.reward.stars--;
    if (u.last) { delete h.done[u.rid]; state.finished = null; }
    state.run = { rid: u.rid, date: u.date, s0: u.s0, idx: u.idx, t0: u.t0, alerted: false };
    save(); renderChild();
  },
  // Зроблений сьогодні розпорядок можна почати ще раз
  again(id) {
    const r = routine(id); if (!r) return;
    confirmBox(esc(T('againAsk', { name: rname(r) })), T('againYes'), () => {
      delete hist().done[id]; state.finished = null; unlockAudio(); startRun(r); renderChild();
    });
  },
  pause() {
    const run = validRun(); if (!run || run.paused) return;
    run.paused = Date.now(); save(); renderChild();
  },
  resume() {
    const run = validRun(); if (!run || !run.paused) return;
    const d = Date.now() - run.paused; // пауза не рахується ні в час справи, ні в тривалість розпорядку
    run.t0 += d; if (run.s0) run.s0 += d; delete run.paused;
    unlockAudio(); save(); renderChild();
  },
  stopChild() {
    const run = validRun(); if (!run) return renderChild();
    confirmBox(esc(T('stopAsk', { name: rname(routine(run.rid)) })), T('stopYes'), () => {
      const cur = validRun(); if (!cur) return renderChild();
      hist(cur.date).done[cur.rid] = true; // щоб не запустився знову сьогодні
      state.run = null; save(); renderChild(); toast(T('stopped'));
    });
  },
  start(id) { unlockAudio(); const r = routine(id); if (r) { startRun(r); renderChild(); } },
  closeFinish() { state.finished = null; save(); renderChild(); },
  gate() {
    const a = 12 + rand(8), b = 3 + rand(7); gateAns = a * b;
    modal(`<h2>${esc(T('forAdults'))}</h2><div class="q">${a} × ${b} = ?</div>
      <input id="gateIn" inputmode="numeric" autocomplete="off" aria-label="${esc(T('answer'))}">
      <div class="row end"><button class="btn" onclick="A.closeModal()">${esc(T('cancel'))}</button>
      <button class="btn primary" onclick="A.checkGate()">${esc(T('enter'))}</button></div>`);
    const i = $('#gateIn'); i.focus();
    i.addEventListener('keydown', e => { if (e.key === 'Enter') A.checkGate(); });
  },
  checkGate() {
    const i = $('#gateIn');
    if (parseInt(i.value, 10) === gateAns) { closeModal(); pTab = 'routines'; draft = null; renderParent(); }
    else { const m = $('.modal'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); i.value = ''; i.focus(); }
  },
  closeModal,
  exitParent() {
    if (draft) return confirmBox(esc(T('leaveUnsaved')), T('leave'), () => { draft = null; renderChild(); });
    renderChild();
  },
  tab(k) { pTab = k; renderParent(); },
  edit(id) {
    const r = id && routine(id);
    draft = r ? JSON.parse(JSON.stringify(r))
      : { id: uid(), name: T('newRoutineName'), start: '08:00', days: [1,2,3,4,5], tasks: [{ icon: '⏰', name: T('firstTask'), min: 5 }], isNew: true };
    renderParent(); window.scrollTo(0, 0);
  },
  fromTpl(i) { draft = { ...fromTemplate(TEMPLATES[i]), isNew: true }; renderParent(); window.scrollTo(0, 0); },
  dset(k, v) { draft[k] = v; },
  dname(v) { draft.name = v; delete draft.tk; },
  dday(n) { const d = draft.days; const i = d.indexOf(n); i >= 0 ? d.splice(i, 1) : d.push(n); renderParent(); },
  tset(i, v) { draft.tasks[i].name = v; delete draft.tasks[i].tk; },
  tmin(i, dir) {
    const t = draft.tasks[i];
    t.min = dir > 0 ? (t.min < 10 ? t.min + 1 : t.min + 5) : (t.min <= 10 ? t.min - 1 : t.min - 5);
    t.min = Math.max(1, Math.min(180, t.min)); renderParent();
  },
  tmove(i, dir) { const a = draft.tasks, j = i + dir; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; renderParent(); },
  tdel(i) { draft.tasks.splice(i, 1); renderParent(); },
  tadd() { draft.tasks.push({ icon: '⏰', name: '', min: 5 }); renderParent(); const ins = document.querySelectorAll('.t-row input'); ins[ins.length - 1]?.focus(); },
  pick(i) {
    modal(`<h2>${esc(T('picture'))}</h2><div class="emoji-grid">${ICONS.map(e => `<button onclick="A.setIcon(${i},'${e}')">${e}</button>`).join('')}</div>
      <button class="btn" onclick="A.closeModal()">${esc(T('cancel'))}</button>`);
  },
  setIcon(i, e) { draft.tasks[i].icon = e; closeModal(); renderParent(); },
  cancelEdit() { draft = null; renderParent(); },
  save() {
    const d = draft;
    if (!d.tk) d.name = d.name.trim() || T('routineDefault');
    d.tasks = d.tasks.map(t => ({ ...t, name: (t.name || '').trim() })).filter(t => t.tk || t.name);
    if (!d.tasks.length) return toast(T('needTask'));
    if (!d.days.length) return toast(T('needDay'));
    delete d.isNew;
    const i = state.routines.findIndex(r => r.id === d.id);
    const old = i >= 0 ? state.routines[i] : null;
    i >= 0 ? (state.routines[i] = d) : state.routines.push(d);
    fixRun(old, d);
    draft = null; save(); validRun(); renderParent(); toast(T('saved'));
  },
  rdel() {
    confirmBox(T('confirmDel', { name: esc(rname(draft)) }), T('del'), () => {
      state.routines = state.routines.filter(r => r.id !== draft.id);
      draft = null; save(); validRun(); renderParent();
    });
  },
  rset(k, v) { state.reward[k] = v; save(); if (k === 'on') renderParent(); },
  rgoal(d) { state.reward.goal = Math.max(5, Math.min(200, state.reward.goal + d)); save(); renderParent(); },
  rgive() { state.reward.stars = Math.max(0, state.reward.stars - state.reward.goal); save(); renderParent(); toast(T('nextReward')); },
  setLang(l) { if (!LANGS.includes(l)) return; lang = state.settings.lang = l; document.documentElement.lang = l; save(); renderParent(); },
  setTz(z) { state.settings.tz = (z === 'auto' || validTz(z)) ? z : 'auto'; save(); validRun(); renderParent(); },
  sound(v) { state.sound = v; save(); if (v) { unlockAudio(); chime(); } },
  skipTask() {
    const run = validRun(); if (!run) return;
    const r = routine(run.rid); run.idx++; resetTask(run);
    if (run.idx >= r.tasks.length) { hist(run.date).done[r.id] = true; state.run = null; }
    save(); renderParent(); toast(T('skipped'));
  },
  stopRun() {
    const run = validRun(); if (!run) return;
    hist(run.date).done[run.rid] = true; // щоб не запустився знову сьогодні
    state.run = null; save(); renderParent(); toast(T('stopped'));
  },
  reset() {
    confirmBox(esc(T('resetConfirm')), T('resetBtn'), () => {
      const keep = { ...state.settings };
      try { localStorage.removeItem(KEY); } catch (e) {}
      load(); state.settings = keep; lang = keep.lang; save(); draft = null; renderParent(); toast(T('resetDone'));
    });
  },
};
window.A = A;

/* ---------- основний цикл ---------- */
function tick() {
  if (!validRun()) {
    const r = autoRoutine();
    if (r) { state.finished = null; startRun(r); if (view === 'child' && !$('#modal')) renderChild(); }
  }
  if (view === 'child') {
    const c = $('#clock'); if (c) c.textContent = clockNow();
    if (state.run) updateTimer();
    else {
      const sig = dayKey() + minsNow() + (state.finished ? 'f' : '');
      if (sig !== idleSig) { idleSig = sig; if (!$('#modal')) renderChild(); }
    }
  }
  keepAwake(!!state.run && !state.run.paused && view === 'child');
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wl = null; tick(); } });
document.addEventListener('pointerdown', unlockAudio, { once: true });

load(); save(); renderChild();
setInterval(tick, 1000); tick();

// Кнопка «Назад» на Android: закрити вікно → вийти з режиму дорослого → згорнути застосунок
if (plug('App')) {
  try {
    plug('App').addListener('backButton', () => {
      if ($('#modal')) return closeModal();
      if (view === 'parent') return draft ? A.cancelEdit() : A.exitParent();
      plug('App').minimizeApp();
    });
  } catch (e) {}
}

if (!NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
